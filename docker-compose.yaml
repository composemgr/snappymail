# nginx proxy address - http://172.17.0.1:64347

name: snappymail
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: djmaze/snappymail:latest
    container_name: snappymail-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: snappymail-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      DEBUG: ${SNAPPYMAIL_DEBUG:-false}
      UPLOAD_MAX_SIZE: ${SNAPPYMAIL_UPLOAD_MAX_SIZE:-25M}
      MEMORY_LIMIT: ${SNAPPYMAIL_MEMORY_LIMIT:-128M}
      SECURE_COOKIES: ${SNAPPYMAIL_SECURE_COOKIES:-true}
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8888/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64347:8888'
    volumes:
      - './volumes/data/snappymail:/var/lib/snappymail:z'
    networks:
      - snappymail

networks:
  snappymail:
    name: snappymail
    external: false
